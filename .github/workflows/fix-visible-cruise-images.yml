name: Fix visible cruise images

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message != 'Fix visible cruise images'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore valid cruise WebP files
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL "https://raw.githubusercontent.com/tranthilanak8-lab/oravia-vietnam/5f2af2c757254c1b6d7853241ef5e5922b60cdd6/assets/cruises/hera-classic-cruise.webp" -o assets/cruises/hera-classic-cruise.webp
          curl -fsSL "https://raw.githubusercontent.com/tranthilanak8-lab/oravia-vietnam/5f2af2c757254c1b6d7853241ef5e5922b60cdd6/assets/cruises/le-journey-luxury-cruise.webp" -o assets/cruises/le-journey-luxury-cruise.webp

      - name: Refresh image URLs
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's#assets/cruises/hera-classic-cruise\.webp?v=[^"]*#assets/cruises/hera-classic-cruise.webp?v=20260919-fix#g' cruises.html
          sed -i 's#assets/cruises/le-journey-luxury-cruise\.webp?v=[^"]*#assets/cruises/le-journey-luxury-cruise.webp?v=20260919-fix#g' cruises.html
          sed -i 's#../assets/cruises/hera-classic-cruise\.webp?v=[^"]*#../assets/cruises/hera-classic-cruise.webp?v=20260919-fix#g' cruises/hera-classic-cruise.html
          sed -i 's#../assets/cruises/le-journey-luxury-cruise\.webp?v=[^"]*#../assets/cruises/le-journey-luxury-cruise.webp?v=20260919-fix#g' cruises/le-journey-luxury-cruise.html
          sed -i 's#assets/cruises/amanda-luxury-cruise\.webp?v=[^"]*#assets/cruises/amanda-luxury-cruise.webp?v=20260919-fix#g' cruises.html
          sed -i 's#assets/cruises/le-journey-elegance-cruise-4-star\.webp?v=[^"]*#assets/cruises/le-journey-elegance-cruise-4-star.webp?v=20260919-fix#g' cruises.html

      - name: Commit fixes and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/fix-visible-cruise-images.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/cruises/hera-classic-cruise.webp assets/cruises/le-journey-luxury-cruise.webp cruises.html cruises/hera-classic-cruise.html cruises/le-journey-luxury-cruise.html .github/workflows/fix-visible-cruise-images.yml
          git commit -m "Fix visible cruise images"
          git push
