name: Apply supplied Celina and Tulip images
on:
  push:
    paths:
      - '.github/cruise-image-parts/**'
      - '.github/workflows/apply-celina-tulip-images.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild exact normalized WebP files
        run: |
          set -e
          mkdir -p assets/cruises
          cat .github/cruise-image-parts/celina.b64 | base64 -d > assets/cruises/celina-of-the-sea.webp
          cat .github/cruise-image-parts/tulip-1.b64 .github/cruise-image-parts/tulip-2.b64 | base64 -d > assets/cruises/tulip-cruise.webp
          rm -rf .github/cruise-image-parts
          rm -f .github/workflows/apply-celina-tulip-images.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/cruises/celina-of-the-sea.webp assets/cruises/tulip-cruise.webp .github/cruise-image-parts .github/workflows/apply-celina-tulip-images.yml
          git commit -m "Replace supplied Celina and Tulip cruise images"
          git push
