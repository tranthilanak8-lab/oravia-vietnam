name: Replace supplied cruise images

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  replace:
    if: github.event.head_commit.message != 'Replace supplied cruise images'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode supplied images
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .upload/hera.b64 > assets/cruises/hera-classic-cruise.webp
          base64 -d .upload/lejourney.b64 > assets/cruises/le-journey-luxury-cruise.webp
      - name: Update image cache URLs
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's#assets/cruises/hera-classic-cruise\.webp?v=[^"]*#assets/cruises/hera-classic-cruise.webp?v=20260919-supplied#g' cruises.html
          sed -i 's#assets/cruises/le-journey-luxury-cruise\.webp?v=[^"]*#assets/cruises/le-journey-luxury-cruise.webp?v=20260919-supplied#g' cruises.html
          sed -i 's#../assets/cruises/hera-classic-cruise\.webp?v=[^"]*#../assets/cruises/hera-classic-cruise.webp?v=20260919-supplied#g' cruises/hera-classic-cruise.html
          sed -i 's#../assets/cruises/le-journey-luxury-cruise\.webp?v=[^"]*#../assets/cruises/le-journey-luxury-cruise.webp?v=20260919-supplied#g' cruises/le-journey-luxury-cruise.html
      - name: Commit supplied images
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .upload
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/cruises/hera-classic-cruise.webp assets/cruises/le-journey-luxury-cruise.webp cruises.html cruises/hera-classic-cruise.html cruises/le-journey-luxury-cruise.html .upload
          git commit -m "Replace supplied cruise images"
          git push
