name: Restore cruise images

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  restore:
    if: github.event.head_commit.message != 'Restore cruise images'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore cruise image assets
        shell: bash
        run: |
          set -euo pipefail

          curl -fsSL "https://raw.githubusercontent.com/tranthilanak8-lab/oravia-vietnam/5f2af2c757254c1b6d7853241ef5e5922b60cdd6/assets/cruises/amanda-luxury-cruise.webp" -o assets/cruises/amanda-luxury-cruise.webp
          curl -fsSL "https://raw.githubusercontent.com/tranthilanak8-lab/oravia-vietnam/5f2af2c757254c1b6d7853241ef5e5922b60cdd6/assets/cruises/le-journey-elegance-cruise-4-star.webp" -o assets/cruises/le-journey-elegance-cruise-4-star.webp

          sed -i 's#assets/cruises/amanda-luxury-cruise\.jpg?v=[^"]*#assets/cruises/amanda-luxury-cruise.webp?v=20260919-restored#g' cruises.html
          sed -i 's#assets/cruises/le-journey-elegance-cruise\.jpg?v=[^"]*#assets/cruises/le-journey-elegance-cruise-4-star.webp?v=20260919-restored#g' cruises.html
          sed -i 's#../assets/cruises/amanda-luxury-cruise\.jpg?v=[^"]*#../assets/cruises/amanda-luxury-cruise.webp?v=20260919-restored#g' cruises/amanda-luxury-cruise.html
          sed -i 's#../assets/cruises/le-journey-elegance-cruise\.jpg?v=[^"]*#../assets/cruises/le-journey-elegance-cruise-4-star.webp?v=20260919-restored#g' cruises/le-journey-elegance-cruise.html

          rm -f .github/workflows/restore-cruise-images.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/cruises/amanda-luxury-cruise.webp assets/cruises/le-journey-elegance-cruise-4-star.webp cruises.html cruises/amanda-luxury-cruise.html cruises/le-journey-elegance-cruise.html .github/workflows/restore-cruise-images.yml
          git commit -m "Restore cruise images"
          git push
