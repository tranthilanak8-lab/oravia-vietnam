name: Assemble Amanda image

on:
  push:
    paths:
      - "assets/cruises/.upload/*.b64"

permissions:
  contents: write

jobs:
  assemble:
    if: github.event.head_commit.message != 'Assemble Amanda image'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble image
        shell: bash
        run: |
          set -euo pipefail
          cat             assets/cruises/.upload/amanda-01.b64             assets/cruises/.upload/amanda-02.b64             assets/cruises/.upload/amanda-03.b64             assets/cruises/.upload/amanda-04.b64             assets/cruises/.upload/amanda-05b.b64             assets/cruises/.upload/amanda-06.b64             | base64 -d > assets/cruises/amanda-luxury-cruise.webp
          file assets/cruises/amanda-luxury-cruise.webp
          rm -rf assets/cruises/.upload
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/cruises/amanda-luxury-cruise.webp assets/cruises/.upload
          git commit -m "Assemble Amanda image"
          git push
